apiVersion: v1
kind: Pod
metadata:
  name: myapp-container-pod
  labels:
    app: myapp-pod
spec:
  containers:
    - name: myapp-container
      image: busybox:1.28
      command: ['sh', '-c', 'echo The app is starting! && sleep 3600']
      env:
      - name: FIRSTNAME
        valueFrom:
          configMapKeyRef:
            name: app-cm
            key: first_name
  