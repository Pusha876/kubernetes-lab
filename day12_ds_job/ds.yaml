apiVersion: apps/v1
kind: DaemonSet
metadata: 
  name: nginx-deploy
  labels:
    env: demo
spec: 
  selector:
    matchLabels:
      env: demo
  template:
    metadata:
      labels:
        env: demo
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80